<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粟島へようこそ</title>
    <link rel="stylesheet" href="index.css">

    <script>
        function calcTime() {
        
            const go = document.getElementById("go").value;
            const back = document.getElementById("back").value;
        
            if (!go || !back) {
                document.getElementById("result").innerHTML =
                    "行きと帰りの便を選択してください";
                return;
            }
        
            const goTime = new Date(`2025-01-01 ${go}`);
            const backTime = new Date(`2025-01-01 ${back}`);
        
            const diff = backTime - goTime;
        
            const minutes = diff / 1000 / 60;
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;

            let course = "";

            if (minutes <= 10) {
                course = "滞在時間が短すぎます。次の便をご検討ください。";
            }
            else if (minutes < 180) {
                course = "お手軽コース";
            }
            else if (minutes < 360) {
                course = "定番コース";
            }
            else {
                course = "満喫コース";
            }

            document.getElementById("result").innerHTML =
                `滞在時間：${hours}時間${mins}分<br><br>${course}`;

        }
        
        function updateBackOptions() {
        
            const goTime = document.getElementById("go").value;
            const options = document.getElementById("back").options;
        
            for(let i = 0; i < options.length; i++) {
        
                if(options[i].value === "") {
                    continue;
                }
        
                options[i].disabled =
                    options[i].value <= goTime;
            }
        
            document.getElementById("back").value = "";
        }
        </script>

</head>

    function showSpot(spot) {
        const selected = spots[spot];
        if (!selected) return;
    
        const detailId = selected.group === "zentaizu"
            ? "zentaizu-detail"
            : "chushin-detail";
    
        document.getElementById(detailId).innerHTML = `
            <h3>${selected.icon} ${selected.name}</h3>
            <p>${selected.description}</p>
            <button type="button" onclick="closeSpot('${selected.group}')">
                閉じる
            </button>
        `;
    }
    
    function closeSpot(group) {
        const detailId = group === "zentaizu"
            ? "zentaizu-detail"
            : "chushin-detail";
    
        const message = group === "zentaizu"
            ? "📍 全体マップの番号を選んでね！"
            : "📍 中心マップの番号を選んでね！";
    
        document.getElementById(detailId).innerHTML =
            `<p>${message}</p>`;
    }
    </script>
